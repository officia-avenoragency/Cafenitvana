.badge{display:inline-block;font-size:12px;letter-spacing:.14em;color:var(--gold);font-weight:700}
.strip{background:var(--esp);color:#f3eadc;padding:26px 0;overflow:hidden}
.strip .in{display:flex;gap:44px;width:max-content;animation:mq 30s linear infinite}
.strip a{font-family:'Playfair Display',serif;font-size:30px;white-space:nowrap}.strip a:hover{color:var(--gold)}

.exp .i2{position:absolute;right:0;bottom:0;width:230px;height:260px;border-radius:24px;background:linear-gradient(150deg,#b9c1a7,var(--olive));border:8px solid var(--bg)}
.exp .words{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.exp .words span{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-size:13px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:34px}
.mom{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px}.mom:nth-child(2){background:var(--esp);color:#f3eadc;transform:translateY(20px)}

.gal .g1{grid-row:span 3;grid-column:span 2}.gal .g2{grid-row:span 2}.gal .g4{grid-column:span 2;grid-row:span 1}.gal .g3{grid-row:span 1}

.ratingnum{font-family:'Playfair Display',serif;font-size:52px;line-height:1;color:var(--esp);font-weight:700}.stars{color:#C69735;letter-spacing:2px;font-size:18px}.ratingcopy{font-size:13px;color:#7a6a5e}.reviewgrid{display:grid;grid-template-columns:1.2fr .8fr;gap:22px;margin-top:30px}.reviewcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px}.reviewcard.featured{background:var(--esp);color:#f3eadc}.reviewcard p{color:#6b5b50}.reviewcard.featured p{color:#eadfce}.reviewcard .quote{font-family:'Playfair Display',serif;font-size:24px;font-style:italic;line-height:1.35;margin:14px 0}.visitcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px}.visitcard .biginfo{font-family:'Playfair Display',serif;font-size:24px;margin:8px 0 20px}.hours{display:grid;grid-template-columns:1fr auto;gap:8px 20px;font-size:14px;margin-top:18px}.hours span:nth-child(even){font-weight:700}.mapbox{min-height:360px;border-radius:24px;background:linear-gradient(145deg,#e7dfd0,#c7bca8);border:1px solid var(--line);overflow:hidden;position:relative}.mapbox .mapinner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px}.mapbox .pin{font-size:52px}.trustline{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px;color:#6b5b50;font-size:13px}.trustline b{color:var(--esp)}

.why{background:var(--soft)}

.visit .wrap{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.info{display:grid;gap:12px;margin-top:20px}.info div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;font-size:14px}.info em{color:#9a8a7d}

.track-btn{font-weight:700;font-size:14px;cursor:pointer}
.track-modal{position:fixed;inset:0;background:rgba(43,33,27,.48);backdrop-filter:blur(7px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:.25s}
.track-modal.on{opacity:1;pointer-events:auto}
.track-card{width:min(460px,100%);background:#fffdf9;border:1px solid var(--line);border-radius:28px;padding:34px 28px;text-align:center;box-shadow:0 30px 80px -25px rgba(43,33,27,.45);transform:translateY(18px) scale(.98);transition:.3s}
.track-modal.on .track-card{transform:none}
.track-icon{width:76px;height:76px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:34px}
.track-card h2{font-size:34px;margin-bottom:10px}

.track-badge{display:inline-flex;align-items:center;gap:7px;background:#f3eadc;color:var(--olive);padding:8px 14px;border-radius:99px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:18px}
.track-close{position:absolute;top:18px;right:18px;width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:20px}
@media(max-width:900px){.track-btn{display:block}}
/* ORDER APP */
body.app{background:#fbf9f4}
.obar{position:sticky;top:0;z-index:30;background:rgba(251,249,244,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}

.back{font-size:14px;font-weight:700;color:var(--olive)}

.tc{background:#fff;border:2px solid var(--line);border-radius:24px;padding:28px 22px;text-align:left;transition:.25s}

.detail{max-width:760px;margin:22px auto 0;background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;text-align:left;animation:up .4s}

.row2{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.ok-wrap{text-align:center;padding:50px 10px}

@media(max-width:900px){
 .links,nav .btn.d{display:none}.burger{display:block}
 .hero .wrap,.exp .wrap,.visit .wrap{grid-template-columns:1fr}.hv{height:380px}.hv .big{font-size:90px}.hv .sm{width:120px;height:120px;font-size:44px}
 .grid4{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr}.mom:nth-child(2){transform:none}
 .gal{grid-template-columns:repeat(2,1fr)}.gal .g1{grid-column:span 2}.exp .imgs{height:380px}.exp .i2{width:150px;height:170px}
 section{padding:56px 0}.menu{grid-template-columns:1fr}

 .fcart{left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;border-radius:18px}

}
.mnav{display:none;position:fixed;inset:72px 0 auto;background:var(--bg);padding:16px 20px;border-bottom:1px solid var(--line);z-index:29;flex-direction:column;gap:14px}.mnav.on{display:flex}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

if(d.q){const[id,k]=d.q.split(":");st.qty[id]=Math.max(1,(st.qty[id]||1)+ +k);t.closest(".mi").outerHTML=cardHTML(ALL.find(x=>x.id===id));return}
if(d.a){const i=ALL.find(x=>x.id===d.a),vi=st.sel[i.id]??0,v=i.v[vi],q=st.qty[i.id]||1,key=i.id+":"+vi;
const ex=st.cart.find(c=>c.key===key);if(ex)ex.qty+=q;else st.cart.push({key,name:i.n,variant:v[0],price:v[1],qty:q});st.qty[i.id]=1;
const card=t.closest(".mi");card.outerHTML=cardHTML(i);const nb=document.querySelector(`[data-a="${i.id}"]`);if(nb){nb.textContent="Added ✓";nb.classList.add("ok");setTimeout(()=>{nb.textContent="Add";nb.classList.remove("ok")},900)}redrawFC();redrawDrawer();return}
if(d.c){st.cat=d.c;document.querySelectorAll(".cats button").forEach(b=>b.classList.toggle("on",b.dataset.c===d.c));$("#mn2").innerHTML=menuHTML();return}
if(d.ci){const[i,k]=d.ci.split(":");st.cart[+i].qty+=+k;if(st.cart[+i].qty<1)st.cart.splice(+i,1);redrawDrawer();redrawFC();return}
if(t.id==="fc"){st.drawer=true;st.step=0;$("#sc").classList.add("on");$("#dr").classList.add("on");redrawDrawer();return}
if(t.id==="sc"||d.x==="close"){st.drawer=false;$("#sc").classList.remove("on");$("#dr").classList.remove("on");if(st.done){st.done=null}return}
if(d.x==="clear"){st.cart=[];redrawDrawer();redrawFC();return}
if(d.x==="next"){if(!st.type){st.drawer=false;$("#dr").classList.remove("on");$("#sc").classList.remove("on");alert("Please choose Order for Home or Order at Café first.");window.scrollTo({top:0,behavior:"smooth"});return}st.step=1;redrawDrawer();return}
if(d.x==="back"){st.step--;redrawDrawer();return}
if(d.x==="review"){if(validate()){st.step=2}redrawDrawer();return}
if(d.x==="place"){if(!validate()||!st.cart.length){st.step=1;redrawDrawer();return}st.done={type:st.type,table:st.form.table,total:sub()};st.cart=[];redrawDrawer();redrawFC();$("#td").innerHTML=typeHTML();return}
if(d.x==="new"){st.done=null;st.drawer=false;st.step=0;$("#sc").classList.remove("on");$("#dr").classList.remove("on");return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const m=document.getElementById("trackModal");if(m){m.classList.remove("on");document.body.style.overflow="";}}});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.f){st.form[t.dataset.f]=t.value;if(st.err[t.dataset.f]){delete st.err[t.dataset.f];}}
if(t.id==="sq"){st.q=t.value;$("#mn2").innerHTML=menuHTML()}});
window.addEventListener("scroll",()=>{const n=$("#nv");n&&n.classList.toggle("sc",scrollY>20)},{passive:true});
window.addEventListener("hashchange",render);
render();
</script></body></html>
